name: CI

# Builds and tests the keyboard on every push. It publishes nothing: release builds, signing and
# the pre-releases phones install from (through Obtainium) live in cstone1983/app-builder, which
# checks out this repo, runs the two native-library scripts below on a clean ubuntu-latest and then
# builds :app:assembleRelease unsigned.
#
# So this job checks exactly that path still works: the native scripts run, :app:assembleRelease
# builds with no keystore.properties (unsigned), and the unit tests pass.
on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          NDK=$(sed -nE 's/^ndk *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          CMAKE=$(sed -nE 's/^cmake *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          BT=$(sed -nE 's/^buildTools *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          API=$(sed -nE 's/^projectCompileSdk=(.*)/\1/p' gradle.properties)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$API" "build-tools;$BT" "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            app/libs/*.jar
            app/src/main/jniLibs
          key: native-v1-${{ hashFiles('tools/fetch-sherpa-onnx.sh', 'tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Fetch on-device speech libraries (sherpa-onnx, checksummed)
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Build offline translation library (Bergamot, arm64)
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so ]; then
            bash tools/bergamot/build-android.sh arm64-v8a
          fi

      - name: Unit tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :lib:dictate-core:testDebugUnitTest

      - name: Release build (unsigned, as app-builder builds it)
        run: |
          test ! -e keystore.properties
          ./gradlew --no-configuration-cache :app:assembleRelease
          ls -l app/build/outputs/apk/release/

      - name: Keep test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            lib/dictate-core/build/reports/tests
          if-no-files-found: ignore
