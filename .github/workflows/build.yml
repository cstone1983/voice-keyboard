name: Build APK

# Builds the keyboard on every push. With the signing secrets set, it builds a signed release APK and
# publishes it as a GitHub release (main / v* tags: "latest", other branches: pre-release). The latest
# main build is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/voice-keyboard.apk
# Without the secrets it builds a debug APK and only keeps it as a workflow artifact.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          NDK=$(sed -nE 's/^ndk *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          CMAKE=$(sed -nE 's/^cmake *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          BT=$(sed -nE 's/^buildTools *= *"(.*)"/\1/p' gradle/tools.versions.toml)
          API=$(sed -nE 's/^projectCompileSdk=(.*)/\1/p' gradle.properties)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$API" "build-tools;$BT" "ndk;$NDK" "cmake;$CMAKE" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            app/libs/*.jar
            app/src/main/jniLibs
          key: native-v1-${{ hashFiles('tools/fetch-sherpa-onnx.sh', 'tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Fetch on-device speech libraries (sherpa-onnx, checksummed)
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Build offline translation library (Bergamot, arm64)
        run: |
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so ]; then
            bash tools/bergamot/build-android.sh arm64-v8a
          fi

      - name: Set up signing
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          # versionCode grows with every CI run so a new APK always installs over the previous one.
          VC=$((1000000 + GITHUB_RUN_NUMBER))
          if [ "$HAS_SIGNING" = "true" ]; then TASK=:app:assembleRelease; else TASK=:app:assembleDebug; fi
          ./gradlew --no-configuration-cache -PprojectVersionCode=$VC "$TASK"
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p out && cp "$APK" out/voice-keyboard.apk
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: voice-keyboard-${{ env.VERSION_CODE }}
          path: out/voice-keyboard.apk

      # main and v* tags become the "latest" release; other branches publish a pre-release (newest first in
      # the release list), so a test build can be installed before it is merged.
      - name: Publish release
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${VERSION_CODE}"
          FLAGS="--prerelease"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then FLAGS="--latest"; fi
          gh release create "$TAG" out/voice-keyboard.apk \
            --title "Voice Keyboard $TAG" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" $FLAGS
