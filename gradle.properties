# Plain dotted numbers only (e.g. 6.4.0), no "-beta" or other suffix: release builds are made by
# cstone1983/app-builder, which publishes <this>.<run> for Obtainium to compare numerically and refuses
# anything else. The app build fails early on a name that is not plain (app/build.gradle.kts).
projectVersionName=6.4.0
